schema_version: 1

context:
  version: "2.1.0"

package:
  name: libddwaf
  version: ${{ version }}

source:
  url: https://github.com/DataDog/libddwaf/archive/refs/tags/${{ version }}.tar.gz
  sha256: 0387a1a7503d87af8d78497ba5c180bbd5225227f0f285559c1a7652f9088821
  patches:
    - patches/0001-Disable-creating-debug-info-files.patch
    - patches/0002-Unbundle-the-dependencies-available-on-CF.patch
    - patches/0003-Fix-Windows-DLL-install-path.patch
    - patches/0004-Remove-MT-override-for-Windows.patch

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}  # If you need any compiler, add the C standard library ("stdlib") too
    - cmake
    - ninja
  host:
    - libutf8proc
    - rapidjson
    - re2
    - gmock
    - gtest
    - yaml-cpp

tests:
  # the package tests are run in build.*
  - package_contents:
      include:
        - ddwaf.h
      lib:
        - ddwaf
      files:
        - if: unix
          then: share/cmake/libddwaf/libddwaf-config.cmake
          else: Library/share/cmake/libddwaf/libddwaf-config.cmake

about:
  homepage: https://github.com/DataDog/libddwaf
  summary: "Datadog's WAF & RASP Engine"
  description: |
    libddwaf is Datadog's implementation of a Web Application Firewall
    (WAF) engine, with a goal of low performance and memory overhead,
    and embeddability in a wide variety of language runtimes through a C
    API.
  license: Apache-2.0 OR BSD-3-Clause
  license_file:
    - LICENSE
    - LICENSE.Apache
    - LICENSE.BSD3
    - src/vendor/fmt/LICENSE.rst
    - src/vendor/libinjection/COPYING
    - src/vendor/lua-aho-corasick/LICENSE
    - LICENSE.radixlib
  repository: https://github.com/DataDog/libddwaf

extra:
  recipe-maintainers:
    - mgorny
